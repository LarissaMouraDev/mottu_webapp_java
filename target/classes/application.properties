# PostgreSQL Azure Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://motoscan-postgres-server.postgres.database.azure.com:5432/motoscandb?sslmode=require
spring.datasource.username=admin_sprint4
spring.datasource.password=suasenha123!
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA/Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# Active Profile
# ==========================================
spring.profiles.active=prod
