name: CI/CD Pipeline - Mottu Challenge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: sprint4
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    
    steps:
    - name:  Checkout do código
      uses: actions/checkout@v4
      
    - name:  Configurar Java ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
        
    - name:  Build com Maven
      run: mvn clean package -DskipTests -B
      
    - name:  Upload do artefato
      uses: actions/upload-artifact@v4
      with:
        name: mottu-app
        path: target/*.jar
        retention-days: 1

  deploy:
    name: Deploy no Azure
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name:  Download do artefato
      uses: actions/download-artifact@v4
      with:
        name: mottu-app
      
    - name:  Deploy para Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '*.jar'
        
    - name:  Verificar deploy
      run: |
        echo " Deploy concluído com sucesso!"
        echo " Aplicação disponível em: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"